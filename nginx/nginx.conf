# Log Pose AI — proxy reverso (incluído dentro do bloco `http` do nginx oficial, em conf.d/)
#   /       -> arquivos estáticos do frontend
#   /api/*  -> backend FastAPI (http://backend:8000), URI repassada sem reescrita

# Rate limit por IP para proteger a cota/custo da API Gemini (SPEC 03: 10 req/min, rajada de 5)
limit_req_zone $binary_remote_addr zone=api_limit:1m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS interno do Docker: resolve "backend" a cada 30s (sobrevive a restart/novo IP do container)
    # e permite `nginx -t` no build sem o backend existir.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Health check sem rate limit (usado pelo setup-ec2.sh e por monitoramento)
    location = /api/health {
        proxy_pass $backend_upstream;
        access_log off;
    }

    # ^~ = prefixo prioritário: regex de estáticos abaixo nunca captura rotas da API
    location ^~ /api/ {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        error_page 429 = @rate_limited;
        error_page 413 = @too_large;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;  # function calling + Gemini pode levar alguns segundos
    }

    # Respostas amigáveis em JSON (o frontend exibe o campo `detail`)
    location @rate_limited {
        default_type application/json;
        add_header Retry-After "10" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        return 429 '{"detail":"Calma, marujo! Muitas perguntas seguidas. Aguarde alguns segundos e tente de novo."}';
    }
    location @too_large {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        return 413 '{"detail":"Mensagem grande demais para o Log Pose. Encurte a pergunta."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML sempre revalidado (deploys aparecem na hora); JS/CSS com cache curto.
    # (add_header num location substitui os do server, por isso repetimos os de segurança)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location ~* \.(?:js|css|svg|png|webp|ico)$ {
        expires 1h;
        access_log off;
    }
}
