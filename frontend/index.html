<!doctype html>
<html lang="pt-BR" class="h-full" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Log Pose AI — guia interativo de One Piece com filtro anti-spoiler." />
  <meta name="theme-color" content="#0B132B" />
  <title>Log Pose AI</title>
  <!-- Tema noite/dia aplicado antes de desenhar a página (sem "piscar"). A escolha do botão fica no
       localStorage; sem escolha, segue o tema do sistema. O botão em si é tratado em app.js. -->
  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("logpose.theme"); } catch { /* modo privado */ }
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#F6F0E2" : "#0B132B";
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%231C2541' stroke='%23F4A261' stroke-width='4'/%3E%3Cpath d='M32 10 39 32 32 54 25 32Z' fill='%23F4A261'/%3E%3Cpath d='M32 32 39 32 32 54 25 32Z' fill='%232A9D8F'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pirata+One&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN, sem build) + Markdown + sanitização de HTML -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // As cores apontam para variáveis CSS (valores no <style> abaixo): a mesma classe, inclusive com
    // opacidade (ex.: bg-gold/10), funciona nos dois temas.
    tailwind.config = (() => {
      const token = (name) => `rgb(var(--c-${name}) / <alpha-value>)`;
      return {
        theme: {
          extend: {
            colors: {
              abyss: token("abyss"),         // fundo principal
              hull: token("hull"),           // cards / superfícies
              rope: token("rope"),           // bordas
              gold: token("gold"),           // destaque dourado
              sea: token("sea"),             // destaque teal
              "sea-ink": token("sea-ink"),   // texto teal sobre fundo teal (selo dos cards)
              ink: token("ink"),             // texto principal
              "ink-2": token("ink-2"),       // texto secundário
              muted: token("muted"),         // legendas, rótulos e placeholder
              "on-gold": token("on-gold"),   // texto sobre o botão dourado
              danger: token("danger"),       // erros
              "danger-ink": token("danger-ink"), // texto da bolha de erro
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              pirate: ['"Pirata One"', "Georgia", "serif"],
            },
          },
        },
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    /* Tokens de cor em "R G B". Noite = padrão (Nautical Dark); dia = carta náutica.
       Todo texto pequeno fica com contraste >= 4,5:1 (WCAG AA) nos dois temas. */
    :root {
      color-scheme: dark;
      --c-abyss: 11 19 43;        /* #0B132B */
      --c-hull: 28 37 65;         /* #1C2541 */
      --c-rope: 58 80 107;        /* #3A506B */
      --c-gold: 244 162 97;       /* #F4A261 */
      --c-sea: 42 157 143;        /* #2A9D8F */
      --c-sea-ink: 94 212 194;    /* #5ED4C2 */
      --c-ink: 241 245 249;       /* #F1F5F9 */
      --c-ink-2: 203 213 225;     /* #CBD5E1 */
      --c-muted: 148 163 184;     /* #94A3B8 */
      --c-on-gold: 11 19 43;      /* #0B132B */
      --c-danger: 239 68 68;      /* #EF4444 */
      --c-danger-ink: 254 226 226; /* #FEE2E2 */
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --c-abyss: 246 240 226;     /* #F6F0E2 pergaminho */
      --c-hull: 255 252 245;      /* #FFFCF5 */
      --c-rope: 203 187 156;      /* #CBBB9C */
      --c-gold: 154 82 14;        /* #9A520E bronze */
      --c-sea: 15 118 110;        /* #0F766E */
      --c-sea-ink: 17 94 89;      /* #115E59 */
      --c-ink: 19 33 60;          /* #13213C azul-marinho */
      --c-ink-2: 51 65 92;        /* #33415C */
      --c-muted: 84 94 115;       /* #545E73 */
      --c-on-gold: 255 252 245;   /* #FFFCF5 */
      --c-danger: 185 28 28;      /* #B91C1C */
      --c-danger-ink: 127 29 29;  /* #7F1D1D */
    }

    /* Markdown das respostas do bot */
    .md > * + * { margin-top: .6rem; }
    .md strong { color: rgb(var(--c-gold)); font-weight: 600; }
    .md.is-error strong { color: inherit; }
    .md em { color: rgb(var(--c-ink-2)); }
    .md a { color: rgb(var(--c-sea)); text-decoration: underline; text-underline-offset: 2px; }
    .md ul { list-style: disc; padding-left: 1.25rem; }
    .md ol { list-style: decimal; padding-left: 1.25rem; }
    .md li + li { margin-top: .25rem; }
    .md h1, .md h2, .md h3 { color: rgb(var(--c-gold)); font-weight: 700; line-height: 1.3; }
    .md h1 { font-size: 1.15rem; } .md h2 { font-size: 1.05rem; } .md h3 { font-size: 1rem; }
    .md code { background: rgb(var(--c-abyss)); border: 1px solid rgb(var(--c-rope)); border-radius: .3rem; padding: .05rem .3rem; font-size: .85em; }
    .md blockquote { border-left: 3px solid rgb(var(--c-sea)); padding-left: .75rem; color: rgb(var(--c-ink-2)); }
    .md table { width: 100%; border-collapse: collapse; font-size: .9em; }
    .md th, .md td { border: 1px solid rgb(var(--c-rope)); padding: .3rem .5rem; text-align: left; }
    .md hr { border-color: rgb(var(--c-rope)); }

    .chips::-webkit-scrollbar { display: none; }
    .chips { scrollbar-width: none; }
    #log { scrollbar-color: rgb(var(--c-rope)) transparent; }

    /* Logo (bússola) com as cores do tema */
    .logo-face { fill: rgb(var(--c-hull)); stroke: rgb(var(--c-gold)); }
    .logo-ring { fill: none; stroke: rgb(var(--c-rope)); }
    .logo-gold { fill: rgb(var(--c-gold)); }
    .logo-sea { fill: rgb(var(--c-sea)); }
    .logo-hub { fill: rgb(var(--c-abyss)); stroke: rgb(var(--c-gold)); }

    /* Botão de tema: mostra o ícone do tema para o qual o clique leva */
    :root[data-theme="dark"] .icon-moon, :root[data-theme="light"] .icon-sun { display: none; }

    .dot { animation: bob 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
    .needle { animation: swing 3.5s infinite ease-in-out; transform-origin: 50% 50%; }
    @keyframes swing { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) { .dot, .needle { animation: none; } }
  </style>
</head>

<body class="h-full bg-abyss text-ink font-sans antialiased">
  <div class="flex h-[100dvh] flex-col">

    <!-- Cabeçalho fixo -->
    <header class="shrink-0 border-b border-rope bg-abyss/95 backdrop-blur">
      <div class="mx-auto flex max-w-4xl flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3">
        <div class="flex items-center gap-3">
          <svg class="h-10 w-10 shrink-0" viewBox="0 0 64 64" aria-hidden="true">
            <circle class="logo-face" cx="32" cy="32" r="28" stroke-width="3" />
            <circle class="logo-ring" cx="32" cy="32" r="21" stroke-width="1.5" stroke-dasharray="2 4" />
            <g class="needle">
              <path class="logo-gold" d="M32 12 38 32 32 52 26 32Z" />
              <path class="logo-sea" d="M32 32 38 32 32 52 26 32Z" />
            </g>
            <circle class="logo-hub" cx="32" cy="32" r="3" stroke-width="1.5" />
          </svg>
          <div>
            <h1 class="font-pirate text-3xl leading-none tracking-wide text-gold">Log Pose AI</h1>
            <p class="text-xs text-muted">Seu guia da Grand Line — sem spoilers</p>
          </div>
        </div>

        <div class="ml-auto flex w-full items-end gap-2 sm:w-auto">
          <label class="flex-1 sm:flex-none">
            <span class="mb-1 block text-xs font-medium text-ink-2">
              Onde você está no anime? <span class="text-gold" aria-hidden="true">*</span>
            </span>
            <select id="arc" required
              class="w-full rounded-lg border border-rope bg-hull px-3 py-2 text-sm text-ink outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/40 sm:w-72">
              <option value="" disabled selected>Selecione seu arco…</option>
            </select>
          </label>
          <button id="clear" type="button" title="Nova conversa" aria-label="Nova conversa"
            class="rounded-lg border border-rope bg-hull p-2 text-ink-2 transition hover:border-gold hover:text-gold focus:outline-none focus:ring-2 focus:ring-gold/40">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.6 15A7 7 0 0 0 18.4 15M18.4 9A7 7 0 0 0 5.6 9" />
            </svg>
          </button>
          <button id="theme" type="button" title="Alternar modo dia/noite" aria-label="Alternar modo dia/noite"
            class="rounded-lg border border-rope bg-hull p-2 text-ink-2 transition hover:border-gold hover:text-gold focus:outline-none focus:ring-2 focus:ring-gold/40">
            <svg class="icon-sun h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="icon-moon h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Área de chat -->
    <main id="log" class="flex-1 overflow-y-auto" role="log" aria-live="polite" aria-label="Conversa com o Log Pose AI">
      <div id="messages" class="mx-auto flex max-w-4xl flex-col gap-4 px-4 py-6"></div>
    </main>

    <!-- Chips + campo de texto -->
    <footer class="shrink-0 border-t border-rope bg-abyss/95 pb-[env(safe-area-inset-bottom)]">
      <div class="mx-auto max-w-4xl px-4 pt-3">
        <div id="chips" class="chips -mx-4 flex gap-2 overflow-x-auto px-4 pb-3 sm:mx-0 sm:flex-wrap sm:px-0"></div>
        <form id="composer" class="flex items-end gap-2 pb-4" autocomplete="off">
          <label for="input" class="sr-only">Sua pergunta sobre One Piece</label>
          <textarea id="input" rows="1" maxlength="500" placeholder="Pergunte sobre personagens, frutas, recompensas, arcos…"
            class="max-h-40 min-h-[44px] flex-1 resize-none rounded-xl border border-rope bg-hull px-4 py-2.5 text-sm text-ink placeholder-muted outline-none transition focus:border-gold focus:ring-2 focus:ring-gold/40"></textarea>
          <button id="send" type="submit" aria-label="Enviar"
            class="flex h-11 shrink-0 items-center gap-2 rounded-xl bg-gold px-4 font-semibold text-on-gold transition hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-gold/50 disabled:cursor-not-allowed disabled:opacity-50">
            <span class="hidden sm:inline">Zarpar</span>
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
      </div>
    </footer>
  </div>

  <!-- ?v=… força o navegador a baixar o JS novo após um deploy (o nginx guarda .js por 1 h) -->
  <script src="app.js?v=20261115"></script>
</body>
</html>
